[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-lake"
version = "1.0.0"
description = "Azure Databricks medallion lakehouse for MetroPT-3 predictive maintenance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karim Amer"}]
dependencies = []

[project.optional-dependencies]
databricks = ["pyspark>=3.5,<4"]
dev = ["pytest>=8", "ruff>=0.6", "PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

