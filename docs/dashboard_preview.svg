<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Power BI equipment health report design preview</title><desc id="desc">Dark themed dashboard wireframe with coverage, anomaly, temperature, status, trend, pressure and monthly KPI visuals.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#0d1c30"/></linearGradient><style>
  .h{font:700 28px 'Segoe UI',Arial;fill:#f4f7fb}.k{font:600 13px 'Segoe UI',Arial;fill:#9fb0c7}.v{font:700 28px 'Segoe UI',Arial;fill:#f4f7fb}.t{font:600 16px 'Segoe UI',Arial;fill:#f4f7fb}.s{font:400 12px 'Segoe UI',Arial;fill:#8fa2ba}.grid{stroke:#24344d;stroke-width:1}.cyan{stroke:#39d0c8;fill:none;stroke-width:3}.blue{stroke:#58a6ff;fill:none;stroke-width:3}.orange{stroke:#ffb454;fill:none;stroke-width:3}</style></defs>
  <rect width="1440" height="810" rx="20" fill="url(#bg)"/><text class="h" x="48" y="56">Metro APU Equipment Health</text><text class="s" x="48" y="79">DESIGN PREVIEW · replace with refreshed Power BI screenshot</text>
  <rect x="1150" y="30" width="242" height="50" rx="8" fill="#111c2e" stroke="#24344d"/><text class="k" x="1170" y="51">DATE RANGE</text><text class="s" x="1170" y="69">Feb 2020 — Aug 2020</text>
  <g><rect x="48" y="110" width="315" height="112" rx="12" fill="#111c2e" stroke="#24344d"/><text class="k" x="68" y="140">TELEMETRY COVERAGE</text><text class="v" x="68" y="181">— %</text><circle cx="320" cy="167" r="25" fill="none" stroke="#39d0c8" stroke-width="8" stroke-dasharray="130 30"/></g>
  <g><rect x="381" y="110" width="315" height="112" rx="12" fill="#111c2e" stroke="#24344d"/><text class="k" x="401" y="140">ANOMALY RATE</text><text class="v" x="401" y="181">— %</text><path d="M625 184 A32 32 0 0 1 675 145" stroke="#ffb454" fill="none" stroke-width="8"/></g>
  <g><rect x="714" y="110" width="315" height="112" rx="12" fill="#111c2e" stroke="#24344d"/><text class="k" x="734" y="140">PEAK OIL TEMPERATURE</text><text class="v" x="734" y="181">— °C</text><path d="M980 187 v-42 a10 10 0 0 0-20 0 v42" stroke="#ff6174" stroke-width="8" fill="none"/></g>
  <g><rect x="1047" y="110" width="345" height="112" rx="12" fill="#111c2e" stroke="#24344d"/><text class="k" x="1067" y="140">HEALTH STATUS</text><text class="v" x="1067" y="181">Awaiting refresh</text></g>
  <g><rect x="48" y="242" width="905" height="270" rx="12" fill="#111c2e" stroke="#24344d"/><text class="t" x="70" y="276">Temperature, current &amp; known failure windows</text>
    <path class="grid" d="M90 310H920M90 360H920M90 410H920M90 460H920"/><path class="blue" d="M90 440 C180 420 200 380 290 400 S430 350 510 375 S640 330 720 355 S840 320 920 340"/><path class="cyan" d="M90 455 C170 448 230 430 300 442 S420 420 500 430 S650 400 720 415 S830 390 920 400"/><rect x="420" y="305" width="25" height="155" fill="#ff6174" opacity=".22"/><rect x="690" y="305" width="42" height="155" fill="#ff6174" opacity=".22"/><text class="s" x="90" y="488">Feb</text><text class="s" x="500" y="488">May</text><text class="s" x="890" y="488">Aug</text></g>
  <g><rect x="971" y="242" width="421" height="270" rx="12" fill="#111c2e" stroke="#24344d"/><text class="t" x="993" y="276">Anomaly threshold</text><path d="M1040 430 A145 145 0 0 1 1325 430" stroke="#24344d" stroke-width="24" fill="none"/><path d="M1040 430 A145 145 0 0 1 1130 304" stroke="#39d0c8" stroke-width="24" fill="none"/><path d="M1130 304 A145 145 0 0 1 1235 308" stroke="#ffb454" stroke-width="24" fill="none"/><path d="M1235 308 A145 145 0 0 1 1325 430" stroke="#ff6174" stroke-width="24" fill="none"/><text class="v" x="1158" y="414">— %</text><text class="s" x="1026" y="463">Normal</text><text class="s" x="1280" y="463">Critical</text></g>
  <g><rect x="48" y="532" width="650" height="230" rx="12" fill="#111c2e" stroke="#24344d"/><text class="t" x="70" y="566">Pressure trends</text><path class="grid" d="M90 600H670M90 650H670M90 700H670"/><path class="cyan" d="M90 690 L160 630 L230 650 L300 610 L370 640 L440 590 L510 620 L580 600 L670 615"/><path class="blue" d="M90 660 L160 645 L230 630 L300 650 L370 620 L440 630 L510 600 L580 625 L670 595"/><path class="orange" d="M90 675 L160 650 L230 640 L300 660 L370 630 L440 642 L510 610 L580 635 L670 605"/></g>
  <g><rect x="716" y="532" width="676" height="230" rx="12" fill="#111c2e" stroke="#24344d"/><text class="t" x="738" y="566">Monthly equipment KPIs</text><text class="k" x="745" y="605">MONTH</text><text class="k" x="880" y="605">READINGS</text><text class="k" x="1030" y="605">COVERAGE</text><text class="k" x="1170" y="605">ANOMALIES</text><path class="grid" d="M740 620H1365M740 656H1365M740 692H1365M740 728H1365"/><text class="s" x="745" y="644">February</text><text class="s" x="745" y="680">March</text><text class="s" x="745" y="716">April</text></g>
</svg>

