name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --editable .
      - name: Compile Python
        run: python -m compileall -q src scripts tests notebooks
      - name: Run unit and sample acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Emit local validation evidence
        run: python scripts/validate_sample.py

